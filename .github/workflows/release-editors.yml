name: Publish editor extensions

on:
  push:
    tags: ['v*', 'vscode-v*', 'visualstudio-v*']
  workflow_dispatch:
    inputs:
      editor:
        description: Extension to build (auto selects by tag prefix, or both)
        type: choice
        options: [auto, vscode, visualstudio]
        default: auto
        required: true
      release_tag:
        description: Existing tag to build and publish (leave empty to build only)
        type: string

permissions:
  contents: read

concurrency:
  group: editor-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name || '') }}
  EDITOR: ${{ github.event_name == 'workflow_dispatch' && inputs.editor != 'auto' && inputs.editor
    || (startsWith(inputs.release_tag || github.ref_name, 'vscode-v') && 'vscode')
    || (startsWith(inputs.release_tag || github.ref_name, 'visualstudio-v') && 'visualstudio')
    || 'all' }}

jobs:
  package:
    if: ${{ !github.event.deleted }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            sdk: windows-x64.zip
            vscode: win32-x64
          - runner: ubuntu-24.04
            sdk: linux-x64.tar.gz
            vscode: linux-x64
          - runner: macos-15
            sdk: macos-arm64.tar.gz
            vscode: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        if: env.EDITOR != 'visualstudio' || runner.os == 'Windows'
        with:
          dotnet-version: '10.0.x'
      - name: Install the SDK and build the language server
        if: env.EDITOR != 'visualstudio' || runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.SUNFLECK_CORE_READ_TOKEN || github.token }}
          CORE_REPOSITORY: ${{ vars.SUNFLECK_CORE_REPOSITORY || 'wvfeng/sunfleck-core' }}
          SDK_TAG: ${{ vars.SUNFLECK_SDK_TAG || 'v1.0.0' }}
          SDK_PLATFORM: ${{ matrix.sdk }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $asset = "Sunfleck-SDK-$env:SDK_PLATFORM"
          gh release download $env:SDK_TAG --repo $env:CORE_REPOSITORY --pattern $asset --dir out
          $sdk = New-Item -ItemType Directory out/sdk
          if ($asset.EndsWith('.zip')) {
              Expand-Archive "out/$asset" -DestinationPath $sdk
          } else {
              tar -xzf "out/$asset" -C $sdk
          }
          dotnet build tools/development/Sunfleck.Development.csproj -c Release "-p:SunfleckSdkRoot=$($sdk.FullName)" -o out/server
      - uses: ./.github/actions/package-vscode
        if: env.EDITOR != 'visualstudio'
        with:
          target: ${{ matrix.vscode }}
          server-directory: out/server
          output-directory: out
      - uses: microsoft/setup-msbuild@v2
        if: env.EDITOR != 'vscode' && runner.os == 'Windows'
        with:
          msbuild-architecture: x64
      - name: Build the Visual Studio extension
        if: env.EDITOR != 'vscode' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $server = (Resolve-Path out/server).Path
          $output = Join-Path $PWD 'out/visualstudio'
          msbuild editors/visualstudio/Sunfleck.VisualStudio.csproj -restore -p:Configuration=Release -p:RestoreLockedMode=true "-p:SunfleckServerDirectory=$server" "-p:OutDir=$output/"
          Copy-Item out/visualstudio/Sunfleck.VisualStudio.vsix out/Sunfleck-Visual-Studio-win-x64.vsix
      - uses: actions/upload-artifact@v4
        if: env.EDITOR != 'visualstudio' || runner.os == 'Windows'
        with:
          name: editor-${{ matrix.vscode }}
          path: out/*.vsix
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' || inputs.release_tag != ''
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: editor-*
          merge-multiple: true
          path: out
      - name: Publish editor extensions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=()
          if [[ "$EDITOR" != visualstudio ]]; then
            assets+=(out/Sunfleck-VSCode-{win32-x64,linux-x64,darwin-arm64}.vsix)
          fi
          if [[ "$EDITOR" != vscode ]]; then
            assets+=(out/Sunfleck-Visual-Studio-win-x64.vsix)
          fi
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done

          if gh release view --json isDraft,assets -- "$RELEASE_TAG" > release.json; then
            for asset in "${assets[@]}"; do
              if ! jq -e --arg name "${asset##*/}" 'any(.assets[]; .name == $name and .state == "uploaded")' release.json > /dev/null; then
                gh release upload --clobber -- "$RELEASE_TAG" "$asset"
              fi
            done
            if jq -e '.isDraft' release.json > /dev/null; then
              gh release edit --draft=false -- "$RELEASE_TAG"
            fi
          else
            gh release create --verify-tag --generate-notes -- "$RELEASE_TAG" "${assets[@]}"
          fi
